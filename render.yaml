# FlowBoard — Render Blueprint (Backend + Database Only)
# Frontend deployed separately on Vercel
# ---------------------------------------------------------------------------
# One managed PostgreSQL database + Dockerized web service (API only).
# Create with: Render Dashboard -> New -> Blueprint -> pick this repo.
#
# What is wired automatically:
#   - DATABASE_URL              -> the managed database's internal connection string
#   - JWT_ACCESS_SECRET/REFRESH -> generated once by Render
#   - PORT / NODE_ENV / COOKIE_SECURE
#
# What you must fill in when prompted (sync: false = "ask me, never overwrite"):
#   - flowboard-api : CORS_ORIGIN, GOOGLE_API_KEY, VAPI_PUBLIC_KEY,
#                     VAPI_PRIVATE_KEY, VAPI_ASSISTANT_ID
#
# Note: NEXT_PUBLIC_API_URL is now handled by Vercel frontend deployment
#       and should be set to your Render API URL (e.g., https://flowboard-api.onrender.com)
#
databases:
  - name: flowboard-db
    databaseName: flowboard
    user: flowboard
    plan: free
    region: oregon

services:
  # -------------------------------------------------------------------------
  # Backend API — Express + Prisma (Docker). Runs `prisma migrate deploy`
  # on start (see backend/Dockerfile CMD), then serves on PORT.
  # -------------------------------------------------------------------------
  - type: web
    name: flowboard-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: PORT
        value: "4000"
      # Public URL of the frontend (for CORS). Set this to your Vercel frontend URL
      # after deploying on Vercel (e.g., https://flowboard-web.vercel.app)
      - key: CORS_ORIGIN
        sync: false
      # Ask AI chatbot (Google Gemini). Server-side only.
      - key: GOOGLE_API_KEY
        sync: false
      # Help & Support (Vapi). Public key is exposed via /support/config;
      # private key stays server-side; assistant id is optional.
      - key: VAPI_PUBLIC_KEY
        sync: false
      - key: VAPI_PRIVATE_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false